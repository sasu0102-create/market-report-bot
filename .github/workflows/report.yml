name: Market Report Bot

on:
  schedule:
    - cron: '40 22 * * *'   # 매일 오전 7:40 KST (UTC+9 → UTC 22:40)
    - cron: '0 9 * * *'     # 매일 오후 6:00 KST (UTC+9 → UTC 9:00)

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Send Morning Report
        if: github.event.schedule == '40 22 * * *'
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="📊 아침 리포트: 미국 증시 요약 + SOX + 한국 강세장 예상"

      - name: Send Evening Report
        if: github.event.schedule == '0 9 * * *'
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="📉 저녁 리포트: 한국 시장 마감 요약"
name: Market Report Bot

on:
  workflow_dispatch:   # 👉 이 줄을 추가하면 Run workflow 버튼이 생깁니다
  schedule:
    - cron: '40 22 * * *'   # 매일 오전 7:40 KST
    - cron: '0 9 * * *'     # 매일 오후 6:00 KST
